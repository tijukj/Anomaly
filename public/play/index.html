<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070714">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ANOMALY // Controller</title>
  <link rel="stylesheet" href="/play/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="app">
    <!-- View 1: Join Screen -->
    <div id="join-view" class="view active">
      <div class="logo-badge">ANOMALY</div>
      <h1 class="title">RACER ACCESS</h1>
      <p class="subtitle">Enter your racer handle</p>

      <form id="join-form">
        <div class="input-group">
          <input 
            type="text" 
            id="player-name-input" 
            maxlength="12" 
            placeholder="RACER NAME" 
            autocomplete="off" 
            autocorrect="off" 
            autocapitalize="characters" 
            spellcheck="false" 
            required 
          />
          <div class="char-count"><span id="char-count">0</span>/12</div>
        </div>
        <button type="submit" id="join-btn" class="glow-btn">ENTER MATCH</button>
      </form>
      <div id="error-msg" class="error-msg"></div>
    </div>

    <!-- View 2: Lobby Waiting Screen -->
    <div id="lobby-view" class="view">
      <div class="player-pill">
        <div class="player-dot" id="lobby-player-dot"></div>
        <div class="player-name-display" id="lobby-player-name">---</div>
      </div>
      
      <div class="status-box">
        <div class="pulse-ring"></div>
        <h2 class="status-title">YOU'RE IN!</h2>
        <p class="status-sub">Waiting for host to start match...</p>
      </div>

      <div class="footer-tip">Keep screen unlocked</div>
    </div>

    <!-- View 3: Running Controller Screen -->
    <div id="running-view" class="view running-layout">
      <!-- Top HUD Stats: Rank & Score -->
      <div class="hud-stats-bar">
        <div class="hud-stat-box rank-box">
          <span class="hud-label">RANK</span>
          <span class="hud-value" id="hud-rank">#1</span>
        </div>

        <div class="hud-player-badge">
          <div class="player-dot mini-dot" id="running-player-dot"></div>
          <span id="running-player-name">---</span>
          <span id="hud-key-badge" class="hud-key-badge hidden">🔑</span>
        </div>

        <div class="hud-stat-box score-box">
          <span class="hud-label">SCORE</span>
          <span class="hud-value" id="hud-score">0</span>
        </div>
      </div>

      <!-- Single Mission Line -->
      <div class="mission-bar">
        <span class="mission-icon">🎯</span>
        <span class="mission-text" id="hud-mission">RACE FOR TREASURE & DISCOVER REGIONS</span>
      </div>

      <!-- Main Game Controller Surface -->
      <div class="control-deck">
        <!-- Left Half: Floating Joystick Touch Zone -->
        <div id="joystick-zone" class="touch-zone left-zone">
          <div class="zone-hint">TOUCH & DRAG TO STEER</div>
          
          <!-- Floating Joystick Element -->
          <div id="joystick-base" class="joystick-base">
            <div id="joystick-knob" class="joystick-knob"></div>
          </div>
        </div>

        <!-- Right Half: Smart Contextual Action Button -->
        <div class="touch-zone right-zone">
          <button type="button" id="action-btn" class="action-btn disabled">
            <span id="action-text" class="action-text">NO TARGET</span>
            <span class="action-glow-ring"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/play/play.js"></script>
</body>
</html>
